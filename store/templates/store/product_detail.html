<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - Détails</title>
    <!-- Lien vers Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Réinitialisation des marges et padding par défaut */
        body, h1, h2, p, a {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        /* Style général du corps de la page */
        body {
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            font-size: 16px;
        }

        /* Header avec fond vert */
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 36px;
            font-weight: 600;
        }

        header nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }

        header nav a i {
            margin-right: 8px;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        /* Section contenant les détails du produit */
        section {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        section img {
            max-width: 500px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        section .product-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        section h2 {
            font-size: 28px;
            color: #4CAF50;
            margin-bottom: 15px;
        }

        section p {
            font-size: 18px;
            color: #555;
            margin-bottom: 15px;
        }

        section .price {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
        }

        section a {
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 18px;
            text-align: center;
            width: 100%;
            margin-top: 20px;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        section a:hover {
            background-color: #45a049;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            section {
                flex-direction: column;
            }

            section img {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>{{ product.name }}</h1>
        <nav>
            <a href="/">
                <i class="fas fa-home"></i> Accueil
            </a>
            <a href="/panier/">
                <i class="fas fa-shopping-cart"></i> Panier
            </a>
        </nav>
    </header>

    <section>
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        <div class="product-details">
            <h2>Description</h2>
            <p>{{ product.description }}</p>
            <p class="price">Prix : {{ product.price }} FCFA</p>
            <a href="{% url 'add_to_cart' product.id %}">Ajouter au Panier</a>
        </div>
    </section>
</body>
</html>
