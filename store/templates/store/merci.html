<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci de votre commande</title>
    <style>
        body {
            background-color: #f4f7fa;
            color: #333;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #4CAF50;
            font-size: 36px;
        }

        p {
            font-size: 20px;
            margin-top: 20px;
        }

        .thank-you-message {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>Merci pour votre commande !</h1>
    <div class="thank-you-message">
        <p>Votre commande a été enregistrée avec succès. Nous vous enverrons un e-mail de confirmation sous peu.</p>
        <p>À très bientôt !</p>
    </div>
</body>
</html>
